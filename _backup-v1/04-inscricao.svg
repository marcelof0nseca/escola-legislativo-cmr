<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>04-inscricao</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-enrollment">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Inscrição</text>
    <text x="28" y="124" class="txt h2">Escolha uma turma</text>
    <rect x="28" y="158" width="644" height="96" rx="8" class="card"/>
    <text x="48" y="194" class="txt h3">Turma A - Online</text>
    <text x="48" y="222" class="txt small muted">12/09 e 13/09 • 19h às 21h • 18/30 vagas</text>
    <rect x="546" y="186" width="98" height="38" rx="5" class="chip"/><text x="570" y="211" class="txt small">Selecionar</text>
    <rect x="28" y="278" width="644" height="96" rx="8" class="card"/>
    <text x="48" y="314" class="txt h3">Turma B - Presencial</text>
    <text x="48" y="342" class="txt small muted">20/09 • 08h às 12h • 0/25 vagas</text>
    <rect x="516" y="306" width="128" height="38" rx="5" class="btn2"/><text x="541" y="331" class="txt small">Fila espera</text>
    <rect x="28" y="410" width="644" height="154" rx="8" class="nav"/>
    <text x="48" y="446" class="txt h3">Regra de negócio</text>
    <text x="48" y="478" class="txt body muted">Se não estiver logado, direcionar para Login/Cadastro.</text>
    <text x="48" y="508" class="txt body muted">Se logado, verificar vagas e duplicidade de inscrição.</text>
    <g><rect x="28" y="610" width="304" height="54" rx="5" class="hotspot"/><text x="98" y="644" class="txt h3">Fazer login</text></g>
    <g><rect x="368" y="610" width="304" height="54" rx="5" class="hotspot"/><text x="430" y="644" class="txt h3">Confirmar inscrição</text></g>
  </g>
</svg>