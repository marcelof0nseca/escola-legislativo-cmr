<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>03-detalhe-do-curso</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-course-detail">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Detalhe do curso</text>
    <g><rect x="575" y="22" width="99" height="34" rx="4" class="hotspot"/><text x="596" y="44" class="txt small">Voltar</text></g>
    <rect x="28" y="106" width="644" height="170" rx="8" fill="#d8e8f7"/>
    <text x="48" y="150" class="txt h1">Processo Legislativo Municipal</text>
    <text x="48" y="190" class="txt body">12/09 • 20h • Online • 30 vagas</text>
    <text x="48" y="226" class="txt small muted">Status: inscrições abertas | Tema: Direito | Público: interno/externo</text>
    <g><rect x="492" y="218" width="150" height="42" rx="5" class="hotspot"/><text x="530" y="245" class="txt h3">Inscrever-se</text></g>
    <rect x="28" y="304" width="156" height="38" rx="5" class="chip"/><text x="54" y="329" class="txt small">Ementa</text>
    <rect x="194" y="304" width="156" height="38" rx="5" class="nav"/><text x="228" y="329" class="txt small">Professor</text>
    <rect x="360" y="304" width="156" height="38" rx="5" class="nav"/><text x="386" y="329" class="txt small">Cronograma</text>
    <rect x="28" y="365" width="644" height="180" rx="8" class="card"/>
    <text x="48" y="402" class="txt h3">O que você vai aprender</text>
    <text x="48" y="438" class="txt body muted">Noções de tramitação, proposições, comissões, votação,</text>
    <text x="48" y="466" class="txt body muted">transparência legislativa e participação cidadã.</text>
    <rect x="28" y="585" width="644" height="150" rx="8" class="nav"/>
    <text x="48" y="620" class="txt h3">Decisão pendente</text>
    <text x="48" y="653" class="txt body muted">Link online: mostrar na página do curso</text>
    <text x="48" y="683" class="txt body muted">ou liberar apenas depois da inscrição?</text>
    <text x="48" y="713" class="txt body muted">Curso online: transmissão externa ou ambiente do portal?</text>
  </g>
</svg>