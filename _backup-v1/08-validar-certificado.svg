<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>08-validar-certificado</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-certificate">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Validar certificado</text>
    <text x="28" y="128" class="txt h2">Consulta pública</text>
    <rect x="28" y="170" width="644" height="54" rx="5" class="input"/>
    <text x="50" y="204" class="txt body muted">Código de autenticidade do certificado</text>
    <rect x="28" y="248" width="260" height="70" rx="5" class="nav"/>
    <text x="50" y="290" class="txt body muted">reCAPTCHA / proteção</text>
    <rect x="412" y="256" width="260" height="54" rx="5" class="hotspot"/>
    <text x="488" y="290" class="txt h3">Pesquisar</text>
    <rect x="28" y="370" width="644" height="170" rx="8" class="card"/>
    <text x="48" y="410" class="txt h3">Resultado válido</text>
    <text x="48" y="448" class="txt body muted">Aluno: Maria da Silva</text>
    <text x="48" y="478" class="txt body muted">CPF: 123.***.***-89 | Curso: Processo Legislativo</text>
    <text x="48" y="508" class="txt body muted">Carga horária: 20h | Conclusão: 13/09/2026</text>
    <rect x="28" y="584" width="644" height="96" rx="8" class="nav"/>
    <text x="48" y="623" class="txt h3">Resultado inválido</text>
    <text x="48" y="653" class="txt body muted">Certificado não encontrado. Verifique o código digitado.</text>
    <rect x="28" y="726" width="644" height="92" rx="8" class="nav"/>
    <text x="48" y="762" class="txt h3">Decisão pendente</text>
    <text x="48" y="792" class="txt body muted">PDF exibirá apenas código e link, ou código + QR Code?</text>
  </g>
</svg>