<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>01-home</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-home">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Escola do Legislativo</text>
    <g><text x="320" y="47" class="txt white tiny">Cursos</text></g>
    <g><text x="368" y="47" class="txt white tiny">Escola</text></g>
    <g><text x="416" y="47" class="txt white tiny">Acervo</text></g>
    <g><text x="468" y="47" class="txt white tiny">Notícias</text></g>
    <g><text x="532" y="47" class="txt white tiny">Contato</text></g>
    <g><rect x="608" y="22" width="66" height="34" rx="4" class="hotspot"/><text x="622" y="44" class="txt small">Entrar</text></g>

    <rect x="28" y="106" width="644" height="80" rx="6" class="nav"/>
    <text x="48" y="139" class="txt h2">Portal de cursos, eventos e certificação</text>
    <text x="48" y="166" class="txt body muted">Agenda, inscrições, notícias e serviços da Escola.</text>

    <rect x="28" y="210" width="500" height="44" rx="5" class="input"/>
    <text x="46" y="238" class="txt body muted">Buscar cursos, notícias ou publicações</text>
    <rect x="540" y="210" width="132" height="44" rx="5" class="btn"/>
    <text x="576" y="238" class="txt white body">Buscar</text>

    <g><text x="28" y="302" class="txt h2">Cursos e eventos</text></g>
    <rect x="28" y="323" width="150" height="34" rx="17" class="chip"/><text x="54" y="346" class="txt small">Abertos</text>
    <rect x="188" y="323" width="150" height="34" rx="17" class="nav"/><text x="216" y="346" class="txt small muted">Realizados</text>
    <g transform="translate(28 380)">
      <rect class="card" width="198" height="230" rx="8"/>
      <rect width="198" height="82" fill="#d8e8f7" rx="8"/>
      <text x="14" y="116" class="txt h3">Processo Legislativo</text>
      <text x="14" y="146" class="txt small muted">12/09 • 20h • Online</text>
      <rect x="14" y="164" width="76" height="24" rx="12" class="success"/><text x="25" y="181" class="txt white small">Abertas</text>
      <rect x="102" y="164" width="72" height="24" rx="12" class="chip"/><text x="116" y="181" class="txt small">Online</text>
      <g><rect x="14" y="197" width="170" height="28" rx="4" class="hotspot"/><text x="65" y="217" class="txt small">Detalhes</text></g>
    </g>
    <g transform="translate(250 380)">
      <rect class="card" width="198" height="230" rx="8"/>
      <rect width="198" height="82" fill="#e3e6ea" rx="8"/>
      <text x="14" y="116" class="txt h3">Ética no Serviço</text>
      <text x="14" y="146" class="txt small muted">22/09 • 8h • Presencial</text>
      <rect x="14" y="164" width="82" height="24" rx="12" class="warn"/><text x="26" y="181" class="txt white small">Em breve</text>
      <rect x="108" y="164" width="84" height="24" rx="12" class="chip"/><text x="118" y="181" class="txt small">Presencial</text>
      <rect x="14" y="197" width="170" height="28" rx="4" class="btn2"/><text x="65" y="217" class="txt small">Detalhes</text>
    </g>
    <g transform="translate(474 380)">
      <rect class="card" width="198" height="230" rx="8"/>
      <rect width="198" height="82" fill="#dfeee5" rx="8"/>
      <text x="14" y="116" class="txt h3">Tecnologia Pública</text>
      <text x="14" y="146" class="txt small muted">05/10 • 16h • Híbrido</text>
      <rect x="14" y="164" width="78" height="24" rx="12" class="danger"/><text x="29" y="181" class="txt white small">Esgotado</text>
      <rect x="104" y="164" width="70" height="24" rx="12" class="chip"/><text x="118" y="181" class="txt small">Híbrido</text>
      <rect x="14" y="197" width="170" height="28" rx="4" class="btn2"/><text x="65" y="217" class="txt small">Detalhes</text>
    </g>

    <text x="28" y="662" class="txt h2">Acesso rápido</text>
    <g><rect x="28" y="685" width="304" height="72" rx="8" class="hotspot"/><text x="64" y="728" class="txt h3">Validar certificado</text></g>
    <g><rect x="368" y="685" width="304" height="72" rx="8" class="hotspot"/><text x="430" y="728" class="txt h3">Área do aluno</text></g>

    <text x="28" y="808" class="txt h2">Notícias em destaque</text>
    <g><rect x="28" y="832" width="200" height="56" rx="6" class="hotspot"/><text x="44" y="856" class="txt small">Nova parceria</text><text x="44" y="874" class="txt small">formalizada</text></g>
    <g><rect x="250" y="832" width="200" height="56" rx="6" class="hotspot"/><text x="266" y="865" class="txt small">Agenda do semestre</text></g>
    <g><rect x="472" y="832" width="200" height="56" rx="6" class="hotspot"/><text x="488" y="856" class="txt small">Publicações</text><text x="488" y="874" class="txt small">recentes</text></g>
  </g>
</svg>