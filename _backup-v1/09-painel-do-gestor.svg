<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>09-painel-do-gestor</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-admin">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Painel do gestor</text>
    <rect x="28" y="110" width="150" height="760" rx="6" class="nav"/>
    <text x="48" y="150" class="txt h3">Menu</text>
    <text x="48" y="190" class="txt small">Cursos</text>
    <text x="48" y="222" class="txt small">Turmas</text>
    <text x="48" y="254" class="txt small">Inscrições</text>
    <text x="48" y="286" class="txt small">Frequência</text>
    <text x="48" y="318" class="txt small">Certificados</text>
    <text x="48" y="350" class="txt small">Professores</text>
    <text x="48" y="382" class="txt small">Notícias</text>
    <text x="48" y="414" class="txt small">Acervo</text>
    <text x="48" y="446" class="txt small">Parcerias</text>
    <rect x="206" y="110" width="466" height="118" rx="8" class="card"/>
    <text x="226" y="146" class="txt h3">Resumo operacional</text>
    <text x="226" y="178" class="txt body muted">Cursos ativos: 6 • Inscrições: 142</text>
    <text x="226" y="206" class="txt body muted">Certificados pendentes: 31</text>
    <rect x="206" y="258" width="466" height="176" rx="8" class="card"/>
    <text x="226" y="296" class="txt h3">Gestão de cursos</text>
    <text x="226" y="328" class="txt body muted">Criar, editar, publicar e encerrar</text>
    <text x="226" y="356" class="txt body muted">cursos, eventos e turmas.</text>
    <rect x="522" y="366" width="120" height="42" rx="5" class="btn"/><text x="553" y="393" class="txt white small">Novo</text>
    <rect x="206" y="462" width="466" height="160" rx="8" class="card"/>
    <text x="226" y="500" class="txt h3">Fila e cancelamentos</text>
    <text x="226" y="532" class="txt body muted">Promover próximo da fila, cancelar</text>
    <text x="226" y="560" class="txt body muted">inscrição e registrar log.</text>
    <rect x="206" y="650" width="466" height="174" rx="8" class="nav"/>
    <text x="226" y="688" class="txt h3">Conteúdo do portal</text>
    <text x="226" y="720" class="txt body muted">Notícias, composição da Escola,</text>
    <text x="226" y="748" class="txt body muted">instrumentos jurídicos, acervo,</text>
    <text x="226" y="776" class="txt body muted">publicações, manuais e parceiros.</text>
  </g>
</svg>