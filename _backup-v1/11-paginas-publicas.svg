<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="190" viewBox="0 0 1510 190">
  <title>11-paginas-publicas</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="1510" height="190"/>
  <g id="frame-public-content">
    <rect class="frame shadow" width="1510" height="190" rx="8"/>
    <rect class="top" width="1510" height="58" rx="8"/>
    <text x="28" y="38" class="txt white h2">Demais páginas públicas</text>
    <rect x="28" y="86" width="330" height="74" rx="8" class="card"/>
    <text x="48" y="118" class="txt h3">A Escola</text>
    <text x="48" y="146" class="txt small muted">Quem somos, história, composição</text>
    <rect x="392" y="86" width="330" height="74" rx="8" class="card"/>
    <text x="412" y="118" class="txt h3">Acervo / biblioteca</text>
    <text x="412" y="146" class="txt small muted">Publicações, manuais, legislações</text>
    <rect x="756" y="86" width="330" height="74" rx="8" class="card"/>
    <text x="776" y="118" class="txt h3">Parceiras</text>
    <text x="776" y="146" class="txt small muted">Convênios e instrumentos jurídicos</text>
    <rect x="1120" y="86" width="330" height="74" rx="8" class="card"/>
    <text x="1140" y="118" class="txt h3">Contato</text>
    <text x="1140" y="146" class="txt small muted">E-mail, endereço e telefone</text>
  </g>
</svg>