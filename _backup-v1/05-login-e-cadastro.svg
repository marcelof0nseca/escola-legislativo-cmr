<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>05-login-e-cadastro</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-login">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Login e cadastro</text>
    <rect x="78" y="128" width="544" height="720" rx="8" class="card"/>
    <text x="118" y="178" class="txt h2">Acesse sua área restrita</text>
    <text x="118" y="226" class="txt h3">Login do usuário</text>
    <rect x="118" y="244" width="464" height="46" rx="5" class="input"/><text x="136" y="273" class="txt small muted">CPF ou e-mail</text>
    <text x="118" y="330" class="txt h3">Senha</text>
    <rect x="118" y="348" width="464" height="46" rx="5" class="input"/><text x="136" y="377" class="txt small muted">••••••••</text>
    <rect x="118" y="424" width="18" height="18" class="input"/><text x="148" y="440" class="txt small">Manter minha sessão</text>
    <g><rect x="118" y="474" width="464" height="50" rx="5" class="hotspot"/><text x="322" y="506" class="txt h3">Entrar</text></g>
    <g><text x="118" y="560" class="txt small muted">Esqueci minha senha</text></g>
    <line x1="118" y1="598" x2="582" y2="598" class="line"/>
    <text x="118" y="638" class="txt h3">Novo aluno</text>
    <g><rect x="118" y="662" width="464" height="50" rx="5" class="btn2"/><text x="270" y="694" class="txt h3">Criar cadastro</text></g>
    <text x="118" y="752" class="txt small muted">Simulação de perfil no Figma:</text>
    <g><rect x="118" y="770" width="136" height="34" rx="5" class="hotspot"/><text x="154" y="792" class="txt small">Gestor</text></g>
    <g><rect x="282" y="770" width="136" height="34" rx="5" class="hotspot"/><text x="316" y="792" class="txt small">Professor</text></g>
    <g><rect x="446" y="770" width="136" height="34" rx="5" class="hotspot"/><text x="484" y="792" class="txt small">Aluno</text></g>
  </g>
</svg>