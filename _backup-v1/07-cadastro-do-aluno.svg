<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>07-cadastro-do-aluno</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-register">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Cadastro do aluno</text>
    <text x="28" y="124" class="txt h2">Dados pessoais</text>
    <rect x="28" y="152" width="300" height="44" rx="5" class="input"/><text x="46" y="180" class="txt small muted">Nome completo</text>
    <rect x="358" y="152" width="314" height="44" rx="5" class="input"/><text x="376" y="180" class="txt small muted">CPF</text>
    <rect x="28" y="220" width="300" height="44" rx="5" class="input"/><text x="46" y="248" class="txt small muted">E-mail</text>
    <rect x="358" y="220" width="314" height="44" rx="5" class="input"/><text x="376" y="248" class="txt small muted">Telefone / WhatsApp</text>
    <rect x="28" y="288" width="644" height="44" rx="5" class="input"/><text x="46" y="316" class="txt small muted">Tipo de vínculo</text>
    <rect x="28" y="356" width="300" height="44" rx="5" class="input"/><text x="46" y="384" class="txt small muted">Matrícula, se servidor</text>
    <rect x="358" y="356" width="314" height="44" rx="5" class="input"/><text x="376" y="384" class="txt small muted">Senha</text>
    <rect x="28" y="444" width="644" height="136" rx="8" class="nav"/>
    <text x="48" y="480" class="txt h3">LGPD</text>
    <text x="48" y="512" class="txt body muted">Coletar apenas dados necessários para inscrição, comunicação,</text>
    <text x="48" y="542" class="txt body muted">certificação, histórico e comprovação do vínculo declarado.</text>
    <g><rect x="28" y="632" width="644" height="54" rx="5" class="hotspot"/><text x="300" y="666" class="txt h3">Cadastrar</text></g>
  </g>
</svg>