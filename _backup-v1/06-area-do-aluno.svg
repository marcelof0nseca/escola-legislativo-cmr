<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920">
  <title>06-area-do-aluno</title>
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:#fff;stroke:#c9d2dc;stroke-width:2}
      .top{fill:#18324a}
      .nav{fill:#eef3f7;stroke:#ccd6df}
      .txt{font-family:Arial, Helvetica, sans-serif;fill:#243447}
      .muted{fill:#607080}
      .tiny{font-size:12px}
      .small{font-size:14px}
      .body{font-size:18px}
      .h1{font-size:32px;font-weight:700}
      .h2{font-size:24px;font-weight:700}
      .h3{font-size:18px;font-weight:700}
      .white{fill:#fff}
      .primary{fill:#0b6bcb}
      .success{fill:#16845b}
      .warn{fill:#d79000}
      .danger{fill:#c0392b}
      .line{stroke:#8da0b3;stroke-width:2;fill:none}
      .dash{stroke:#8da0b3;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .btn{fill:#0b6bcb;stroke:#084f96}
      .btn2{fill:#fff;stroke:#0b6bcb}
      .input{fill:#fff;stroke:#aab8c5}
      .chip{fill:#e9f2ff;stroke:#9cc8f5}
      .card{fill:#fff;stroke:#d6dee6;stroke-width:2}
      .shadow{filter:url(#shadow)}
      .hotspot{fill:#fff6d7;stroke:#d79000;stroke-width:2}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8da0b3"/>
    </marker>
  </defs>
  <rect class="bg" width="700" height="920"/>
  <g id="frame-student">
    <rect class="frame shadow" width="700" height="920" rx="8"/>
    <rect class="top" width="700" height="78" rx="8"/>
    <text x="28" y="48" class="txt white h2">Área do aluno</text>
    <g><rect x="592" y="22" width="82" height="34" rx="4" class="hotspot"/><text x="612" y="44" class="txt small">Sair</text></g>
    <text x="28" y="126" class="txt h2">Olá, Maria</text>
    <rect x="28" y="160" width="196" height="92" rx="8" class="card"/>
    <text x="48" y="195" class="txt h3">Meus cursos</text>
    <text x="48" y="224" class="txt h1">3</text>
    <rect x="252" y="160" width="196" height="92" rx="8" class="card"/>
    <text x="272" y="195" class="txt h3">Certificados</text>
    <text x="272" y="224" class="txt h1">2</text>
    <rect x="476" y="160" width="196" height="92" rx="8" class="card"/>
    <text x="496" y="195" class="txt h3">Fila espera</text>
    <text x="496" y="224" class="txt h1">1</text>
    <text x="28" y="306" class="txt h2">Inscrições</text>
    <rect x="28" y="330" width="644" height="94" rx="8" class="card"/>
    <text x="48" y="365" class="txt h3">Processo Legislativo Municipal</text>
    <text x="48" y="392" class="txt small muted">Confirmada • Turma A • Material disponível após liberação</text>
    <rect x="528" y="358" width="116" height="38" rx="5" class="btn2"/><text x="551" y="383" class="txt small">Cancelar</text>
    <rect x="28" y="448" width="644" height="94" rx="8" class="card"/>
    <text x="48" y="483" class="txt h3">Redação Oficial</text>
    <text x="48" y="510" class="txt small muted">Em fila de espera • posição 4</text>
    <text x="28" y="608" class="txt h2">Meus certificados</text>
    <rect x="28" y="632" width="644" height="74" rx="8" class="nav"/>
    <text x="48" y="676" class="txt h3">Seminário de Boas Práticas Legislativas</text>
    <rect x="548" y="650" width="96" height="38" rx="5" class="btn"/><text x="574" y="675" class="txt white small">Baixar</text>
    <rect x="28" y="750" width="644" height="86" rx="8" class="nav"/>
    <text x="48" y="787" class="txt h3">Atualizar meus dados</text>
    <text x="48" y="815" class="txt small muted">Nome, e-mail, telefone, vínculo e matrícula quando aplicável.</text>
  </g>
</svg>