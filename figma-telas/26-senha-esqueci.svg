  </g>
  <text x="480" y="330" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#122231" font-weight="700">Esqueci minha senha</text>
  <text x="480" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778A">Informe o identificador cadastrado. Se ele existir na base,</text>
  <text x="480" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778A">enviaremos um link de recuperação para o e-mail vinculado à</text>
  <text x="480" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778A">conta.</text>
  <text x="480" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A" font-weight="700">CPF ou e-mail cadastrado</text>
  <text x="664.4" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#A62B21" font-weight="700">*</text>
  <rect x="480" y="456" width="480" height="52" rx="6" fill="#FFFFFF" stroke="#C2CEDA" stroke-width="1.4"/>
  <g transform="translate(493,473) scale(0.75)">
