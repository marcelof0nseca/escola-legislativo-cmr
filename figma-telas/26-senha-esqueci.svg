  <rect x="477" y="535" width="486" height="60" rx="9" fill="none" stroke="#B8862B" stroke-width="1.5"/>
  <line x1="480" y1="618" x2="960" y2="618" stroke="#DBE3EC" stroke-width="1.2"/>
  <text x="720" y="644.55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0D4E85" text-anchor="middle">Lembrou a senha? Voltar para o login</text>
