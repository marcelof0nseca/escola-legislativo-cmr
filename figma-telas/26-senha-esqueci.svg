  </g>
  <text x="520" y="487" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2A3B4A">123.456.789-00</text>
  <rect x="480" y="538" width="480" height="54" rx="6" fill="#1263A5" stroke="#0D4E85" stroke-width="1.5"/>
  <g transform="translate(591.14,556) scale(0.75)">
