  <text x="120" y="816" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#B8862B" font-weight="700" letter-spacing="1.6">NOTA DE ANÁLISE - NÃO FAZ PARTE DA INTERFACE</text>
  <text x="120" y="820" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2A3B4A"></text>
  <text x="120" y="848" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8FA6BA" font-weight="700">Requisitos atendidos nesta tela</text>
  <rect x="360" y="835" width="208.3" height="22" rx="4" fill="#1D3448" stroke="#2F5171" stroke-width="1"/>
  <text x="464.15" y="850.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#CFE0EE" font-weight="700" text-anchor="middle">RF 5 - Recuperação de senha</text>
  <text x="120" y="880" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8FA6BA" font-weight="700">Observação</text>
  <text x="120" y="900" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#9FB6CB">O sistema solicita o identificador do usuário (CPF ou e-mail). Por segurança, a resposta é sempre a mesma, exista ou não o identificador na base.</text>
  </g>
