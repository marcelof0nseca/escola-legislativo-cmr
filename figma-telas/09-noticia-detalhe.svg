  <text x="520" y="678.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">FOTO DA MATÉRIA</text>
  <text x="120" y="860" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#95A5B4">Assinatura do acordo na sede da CMR · Foto: Comunicação/CMR</text>
  <text x="120" y="884" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">A Câmara Municipal do Recife, por meio da Escola do Legislativo, assinou nesta semana acordo de</text>
  <text x="120" y="910" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">cooperação técnica com a Escola do Legislativo da Assembleia Legislativa de Minas Gerais.</text>
  <text x="120" y="954" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">O instrumento prevê o intercâmbio de cursos, material didático e metodologias de capacitação</text>
  <text x="120" y="980" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">continuada, além da possibilidade de oferta conjunta de turmas a distância para servidores das</text>
  <text x="120" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">duas casas legislativas.</text>
  <text x="120" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">Segundo a coordenação da Escola, a primeira ação conjunta será a oferta do curso de Processo</text>
  <text x="120" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">Legislativo Municipal em formato híbrido, com vagas reservadas ao público externo.</text>
  <text x="120" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">O acordo tem vigência de 24 meses e está publicado, na íntegra, na página de Legislação e</text>
  <text x="120" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#2A3B4A">Transparência do portal, junto aos demais instrumentos jurídicos formalizados pela Escola.</text>
