  <text x="238" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#64778A">Publicado em 12/08/2026 às 10h32 · Assessoria da Escola do Legislativo</text>
  <text x="120" y="370" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#122231" font-weight="700">Escola do Legislativo firma parceria com</text>
  <text x="120" y="412" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#122231" font-weight="700">a Escola do Legislativo de Minas Gerais</text>
