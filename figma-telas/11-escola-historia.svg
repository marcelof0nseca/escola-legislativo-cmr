  <text x="186" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0D4E85" font-weight="700">O portal que você está vendo</text>
  <text x="152" y="1244" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2A3B4A">Este portal nasce da solicitação encaminhada pelo Diretor Ricardo Ferraz no processo nº</text>
  <text x="152" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2A3B4A">3096/2025, com as necessidades de negócio reportadas por Robertson Barros: divulgar a agenda</text>
  <text x="152" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2A3B4A">de cursos e eventos, receber inscrições, divulgar escolas parceiras e publicar notícias e</text>
  <text x="152" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2A3B4A">instrumentos jurídicos formalizados.</text>
