  <text x="574.5" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64778A">Escolas parceiras</text>
  <line x1="120" y1="362" x2="1320" y2="362" stroke="#DBE3EC" stroke-width="1.5"/>
  <rect x="120" y="406" width="762" height="726" rx="12" fill="#FFFFFF" stroke="#DBE3EC" stroke-width="1.2"/>
  <text x="152" y="458" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#122231" font-weight="700">Linha do tempo</text>
  <rect x="152" y="470" width="46" height="4" rx="2" fill="#B8862B"/>
  <circle cx="161" cy="516" r="9" fill="#FFFFFF" stroke="#1263A5" stroke-width="3"/>
  <line x1="161" y1="528" x2="161" y2="624" stroke="#C2CEDA" stroke-width="2"/>
  <text x="192" y="514" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0D4E85" font-weight="700">2019</text>
  <text x="262" y="514" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#122231" font-weight="700">Primeiras capacitações internas</text>
  <text x="192" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">A Câmara passa a promover cursos pontuais de técnica legislativa para servidores efetivos.</text>
  <circle cx="161" cy="632" r="9" fill="#FFFFFF" stroke="#1263A5" stroke-width="3"/>
  <line x1="161" y1="644" x2="161" y2="740" stroke="#C2CEDA" stroke-width="2"/>
  <text x="192" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0D4E85" font-weight="700">2022</text>
  <text x="262" y="630" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#122231" font-weight="700">Programa de Educação Continuada</text>
  <text x="192" y="656" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">Criação do programa permanente de capacitação, com calendário semestral e controle manual</text>
  <text x="192" y="676" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">de inscrições.</text>
  <circle cx="161" cy="748" r="9" fill="#FFFFFF" stroke="#1263A5" stroke-width="3"/>
  <line x1="161" y1="760" x2="161" y2="856" stroke="#C2CEDA" stroke-width="2"/>
  <text x="192" y="746" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0D4E85" font-weight="700">2024</text>
  <text x="262" y="746" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#122231" font-weight="700">Criação formal da Escola</text>
  <text x="192" y="772" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">A Resolução nº 1.842/2024 institui a Escola do Legislativo como unidade da estrutura da</text>
  <text x="192" y="792" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">CMR.</text>
  <circle cx="161" cy="864" r="9" fill="#FFFFFF" stroke="#1263A5" stroke-width="3"/>
  <line x1="161" y1="876" x2="161" y2="972" stroke="#C2CEDA" stroke-width="2"/>
  <text x="192" y="862" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0D4E85" font-weight="700">2025</text>
  <text x="262" y="862" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#122231" font-weight="700">Abertura ao público externo</text>
  <text x="192" y="888" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">Cursos passam a aceitar servidores de outros órgãos e cidadãos, ampliando o alcance da</text>
  <text x="192" y="908" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">Escola.</text>
  <circle cx="161" cy="980" r="9" fill="#FFFFFF" stroke="#1263A5" stroke-width="3"/>
  <text x="192" y="978" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0D4E85" font-weight="700">2026</text>
  <text x="262" y="978" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#122231" font-weight="700">Portal digital da Escola</text>
  <text x="192" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">Processo nº 3096/2025 dá origem ao portal com inscrições on-line, certificação digital e</text>
  <text x="192" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">acervo.</text>
