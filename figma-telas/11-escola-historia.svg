  <text x="240.75" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700">História</text>
  <text x="120" y="220" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700">História</text>
  <text x="120" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#B7C7D6">A trajetória da Escola do Legislativo da Câmara Municipal do Recife</text>
  <text x="120" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64778A">Quem Somos</text>
  <text x="232.75" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#122231" font-weight="700">História</text>
  <rect x="232.75" y="360" width="69" height="3.5" rx="2" fill="#B8862B"/>
