  <text x="170" y="927" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0D4E85" font-weight="700">Cenários possíveis da consulta</text>
  <text x="170" y="949" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2A3B4A">Código válido: o portal exibe a tela de confirmação com os dados do documento. Código inválido: o portal exibe a mensagem 'Certificado não encontrado.</text>
  <text x="170" y="969" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2A3B4A">Verifique se o código foi digitado corretamente.'</text>
