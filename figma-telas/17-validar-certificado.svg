  <text x="164" y="228" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700">Validação de Certificados</text>
  <text x="120" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#B7C7D6">Área pública para que qualquer cidadão, empresa ou órgão governamental confira a autenticidade</text>
  <text x="120" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#B7C7D6">dos certificados emitidos pela Escola do Legislativo.</text>
  <rect x="120" y="386" width="700" height="470" rx="12" fill="#FFFFFF" stroke="#DBE3EC" stroke-width="1.4"/>
  <text x="156" y="444" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#122231" font-weight="700">Informe o código de autenticidade</text>
  <text x="156" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A">O código está impresso no rodapé do certificado em PDF.</text>
  <text x="156" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A" font-weight="700">Código de Autenticidade do Certificado</text>
