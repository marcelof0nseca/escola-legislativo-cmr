  <text x="142" y="1568" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#C7D6E3">RF 4 (LGPD) - Quais dados devem aparecer na tela de sucesso? A proposta exibe nome completo, CPF mascarado, matrícula (quando servidor), curso, carga horária e</text>
  <text x="142" y="1587" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#C7D6E3">data de conclusão. Confirmar se a matrícula pode ser exibida publicamente.</text>
