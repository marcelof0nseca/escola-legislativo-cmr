  <rect x="206" y="180" width="1028" height="796" rx="8" fill="#E9EEF4"/>
  <rect x="220" y="194" width="1000" height="768" rx="4" fill="#FFFFFF" stroke="#C2CEDA" stroke-width="1.4"/>
