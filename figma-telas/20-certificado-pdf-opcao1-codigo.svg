  <text x="266" y="910" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0E2C4B" font-weight="700" letter-spacing="1">ELCMR-2026-A7K9-3F2D-8B1C</text>
  <text x="266" y="930" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#64778A">Valide em: escoladolegislativo.recife.pe.leg.br/validar-certificado</text>
  <text x="1174" y="898" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#64778A" text-anchor="end">Documento emitido eletronicamente pela</text>
  <text x="1174" y="916" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#64778A" text-anchor="end">Escola do Legislativo - CMR</text>
  <rect x="120" y="1006" width="588" height="214" rx="10" fill="#E3F3EC" stroke="#A9DCC6" stroke-width="1.2"/>
  <g transform="translate(144,1032) scale(0.83)">
  <path d="M4 12.5 9.5 18 20 6" fill="none" stroke="#1B7A57" stroke-width="2.28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="174" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1B7A57" font-weight="700">Vantagens</text>
  <circle cx="150" cy="1084" r="3.5" fill="#1B7A57"/>
  <text x="166" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Layout mais limpo e tradicional, sem elemento gráfico adicional.</text>
  <circle cx="150" cy="1130" r="3.5" fill="#1B7A57"/>
  <text x="166" y="1134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Não depende de câmera nem de leitor de QR Code.</text>
  <circle cx="150" cy="1176" r="3.5" fill="#1B7A57"/>
  <text x="166" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Menor custo de implementação e de impressão.</text>
  <rect x="732" y="1006" width="588" height="214" rx="10" fill="#FCF0DA" stroke="#EBCE95" stroke-width="1.2"/>
  <g transform="translate(756,1032) scale(0.83)">
  <path d="M12 3 22 20H2zM12 9v5M12 17h.01" fill="none" stroke="#B0700A" stroke-width="2.28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="786" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B0700A" font-weight="700">Pontos de atenção</text>
  <circle cx="762" cy="1084" r="3.5" fill="#B0700A"/>
  <text x="778" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Exige digitação manual de 24 caracteres, com risco de erro.</text>
  <circle cx="762" cy="1130" r="3.5" fill="#B0700A"/>
  <text x="778" y="1134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Mais passos até o resultado da validação.</text>
  <circle cx="762" cy="1176" r="3.5" fill="#B0700A"/>
  <text x="778" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2A3B4A">Menos prático para conferência presencial rápida.</text>
  <g id="NOTA-ANALISE">
  <rect x="0" y="1280" width="1440" height="263" fill="#101E2B"/>
  <rect x="0" y="1280" width="1440" height="3" fill="#B8862B"/>
  <text x="120" y="1316" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#B8862B" font-weight="700" letter-spacing="1.6">NOTA DE ANÁLISE - NÃO FAZ PARTE DA INTERFACE</text>
  <text x="120" y="1320" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2A3B4A"></text>
  <text x="120" y="1348" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8FA6BA" font-weight="700">Requisitos atendidos nesta tela</text>
  <rect x="360" y="1335" width="304.9" height="22" rx="4" fill="#1D3448" stroke="#2F5171" stroke-width="1"/>
  <text x="512.45" y="1350.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#CFE0EE" font-weight="700" text-anchor="middle">RF 4 - Geração do código de autenticidade</text>
  <text x="120" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E9B44C" font-weight="700">Decisões pendentes de reunião</text>
  <circle cx="126" cy="1398" r="4.5" fill="#D9534F"/>
  <text x="142" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#C7D6E3">Escolher entre a Opção 1 (somente código alfanumérico + URL) e a Opção 2 (código + QR Code com validação instantânea) para impressão no PDF do certificado.</text>
  <text x="120" y="1443" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#8FA6BA" font-weight="700">Observação</text>
  <text x="120" y="1463" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#9FB6CB">O código identificador único e alfanumérico é gerado automaticamente pelo sistema no momento da emissão do certificado pelo gestor e consta no rodapé do PDF junto à URL da</text>
  <text x="120" y="1483" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#9FB6CB">página de validação.</text>
  </g>
</svg>
