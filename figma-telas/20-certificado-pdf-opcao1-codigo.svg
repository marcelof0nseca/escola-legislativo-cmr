  <text x="132" y="58.32" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">DECISÃO EM REUNIÃO - RF 4</text>
  <text x="120" y="98" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF" font-weight="700">Modelo do certificado em PDF - Opção 1: somente código</text>
  <text x="120" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#B7C7D6">O interessado acessa o portal e digita o código manualmente na área de validação.</text>
