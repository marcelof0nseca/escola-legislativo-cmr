  </g>
  <text x="720" y="330.55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0E2C4B" font-weight="700" text-anchor="middle">CÂMARA MUNICIPAL DO RECIFE</text>
  <text x="720" y="350.02" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B8862B" font-weight="700" text-anchor="middle">ESCOLA DO LEGISLATIVO</text>
  <text x="720" y="416" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#0E2C4B" font-weight="700" text-anchor="middle">CERTIFICADO</text>
  <rect x="660" y="422" width="120" height="3" rx="2" fill="#B8862B"/>
  <text x="720" y="472.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778A" text-anchor="middle">Certificamos que</text>
  <text x="720" y="515.8" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#122231" font-weight="700" text-anchor="middle">MARIA SILVA DOS SANTOS</text>
  <text x="720" y="550.55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64778A" text-anchor="middle">CPF 123.***.***-89  -  Matrícula 20.451-7</text>
  <text x="720" y="590.9" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778A" text-anchor="middle">concluiu com aproveitamento o curso</text>
  <text x="720" y="625.7" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#122231" font-weight="700" text-anchor="middle">Processo Legislativo Municipal</text>
  <text x="720" y="656.73" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2A3B4A" text-anchor="middle">carga horária de 8 (oito) horas, realizado nos dias 14 e 15 de setembro de 2026,</text>
  <text x="720" y="676.73" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#2A3B4A" text-anchor="middle">com frequência de 100% e aprovação na avaliação final.</text>
  <text x="720" y="730.73" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64778A" text-anchor="middle">Recife, 16 de setembro de 2026.</text>
