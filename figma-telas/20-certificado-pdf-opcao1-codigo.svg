  <text x="520" y="792.55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#122231" font-weight="700" text-anchor="middle">Ricardo Ferraz</text>
  <text x="520" y="810.02" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#64778A" text-anchor="middle">Diretor Geral</text>
