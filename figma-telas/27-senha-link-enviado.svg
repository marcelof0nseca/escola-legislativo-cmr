<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="942" viewBox="0 0 1440 942">
  <title>27-senha-link-enviado</title>
  <rect width="1440" height="942" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1440" height="780" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1440" height="120" fill="#0E2C4B"/>
  <rect x="120" y="34" width="52" height="52" rx="9" fill="#1E4D75"/>
  <g transform="translate(133,47) scale(1.08)">
